name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # AGP downloads any missing SDK platform / build-tools itself, using the
      # licenses that setup-android accepts.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name artifact
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dev-$(git rev-parse --short HEAD)"
          fi
          apk="app/build/outputs/apk/debug/app-debug.apk"
          out="offline-keyboard-${version}.apk"
          cp "${apk}" "${out}"
          echo "APK_NAME=${out}" >> "${GITHUB_ENV}"
          ls -l "${out}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-keyboard-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
          fail_on_unmatched_files: true
